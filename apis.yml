aid: venminder-digital-comply
name: Venminder (Digital Comply)
description: >-
  Venminder is a third-party risk management (TPRM) platform for financial institutions —
  vendor onboarding, due diligence, contract tracking, questionnaires, oversight tasks,
  issue tracking, spend analysis and Venmonitor continuous monitoring. Founded in Elizabethtown,
  Kentucky as Digital Comply and backed by Bain Capital Ventures, the company merged with
  Ncontracts in 2024. The Venminder API (OAuth 2.0 client-credentials, scope venminderApi,
  tokens from login.venminder.com) exposes a customer's vendors, products, contracts, documents,
  questionnaires, onboarding requests, oversight and spend data at rsd.venminder.com, alongside
  a SCIM 2.0 user-provisioning surface at /scim/v2.
