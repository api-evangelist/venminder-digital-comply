- aid: venminder-digital-comply:venminder-scim-api
  name: Venminder SCIM 2.0 User Provisioning API
  description: >-
    SCIM 2.0 surface for provisioning Venminder platform users — list, get, search, create and patch Users
    using urn:ietf:params:scim:schemas:core:2.0:User plus the urn:ietf:params:scim:schemas:extension:Venminder:2.0:User
    extension, with standard SCIM filtering, ListResponse and PatchOp semantics. Authenticated with the
    same OAuth 2.0 client-credentials bearer tokens as the Venminder API.
  humanURL: https://developers.venminder.com/
