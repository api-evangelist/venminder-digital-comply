openapi: 3.2.0
info:
  title: Venminder OpenApi Documents API
  version: v1
security:
- Bearer: []
tags:
- name: Documents
paths:
  /api/v1/Documents/{documentKey}:
    get:
      tags:
      - Documents
      summary: Provides a service to download a document
      description: Provides a service to download a document stored in the Venminder platform to a local folder.
      parameters:
      - name: documentKey
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
      operationId: getApiV1DocumentsByDocumentKey
      x-operation-id-source: derived
  /api/v1/Documents/GetDocumentsList:
    get:
      tags:
      - Documents
      summary: Provides a list of documents stored in the Venminder platform
      description: Provides a list of documents stored in the Venminder platform filtered based on a high level category. Some of the properties will include the file name, the upload date, associated vendor product, tags…
      parameters:
      - name: documentCategory
        in: query
        schema:
          type: integer
          format: int32
      - name: documentTag
        in: query
        schema:
          type: string
      - name: documentName
        in: query
        schema:
          type: string
      - name: vendorKey
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenApi.v1.ApiDocument'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
      operationId: getApiV1DocumentsGetDocumentsList
      x-operation-id-source: derived
components:
  schemas:
    OpenApi.v1.ErrorResponse:
      title: OpenApi.v1.ErrorResponse
      type: object
      properties:
        statusCode:
          type: integer
          format: int32
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/OpenApi.v1.ErrorResource'
      additionalProperties: false
      xml:
        name: ErrorResponse
    OpenApi.v1.ApiDocument:
      title: OpenApi.v1.ApiDocument
      type: object
      properties:
        key:
          type:
          - string
          - 'null'
        fileName:
          type:
          - string
          - 'null'
        uploadedDate:
          type:
          - string
          - 'null'
        effectiveDate:
          type:
          - string
          - 'null'
        expirationDate:
          type:
          - string
          - 'null'
        vendorKey:
          type:
          - string
          - 'null'
        isArchived:
          type: boolean
        productKeys:
          type:
          - array
          - 'null'
          items:
            type: string
        tags:
          type:
          - array
          - 'null'
          items:
            type: string
      additionalProperties: false
      xml:
        name: ApiDocument
    OpenApi.v1.ErrorResource:
      title: OpenApi.v1.ErrorResource
      type: object
      properties:
        resourceKey:
          type:
          - string
          - 'null'
        resourceValue:
          type:
          - string
          - 'null'
        field:
          type:
          - string
          - 'null'
      additionalProperties: false
      xml:
        name: ErrorResource
  securitySchemes:
    Bearer:
      type: apiKey
      description: Please insert access token with Bearer into field eg. Bearer eyJhbGciOiJSUzI1Ni and click authorize.
      name: Authorization
      in: header
