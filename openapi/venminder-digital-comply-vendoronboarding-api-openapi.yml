          text/xml:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.EditOnboardingRelationshipQuestionsRequest'
          application/*+xml:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.EditOnboardingRelationshipQuestionsRequest'
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
