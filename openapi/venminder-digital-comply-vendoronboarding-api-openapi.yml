openapi: 3.2.0
info:
  title: Venminder OpenApi Vendor Onboarding API
  version: v1
security:
- Bearer: []
tags:
- name: VendorOnboarding
paths:
  /api/v1/Vendor/Onboarding/Requests:
    get:
      tags:
      - VendorOnboarding
      summary: Provides a list of vendor onboarding requests
      description: Provides a list of vendor onboarding requests. The returned list can be limited based on the status of the request. Information will include vendor name, product name, status, section status…
      parameters:
      - name: statusID
        in: query
        schema:
          type: integer
          format: int32
      - name: requestedDateStart
        in: query
        schema:
          type: string
          format: date-time
      - name: requestedDateEnd
        in: query
        schema:
          type: string
          format: date-time
      - name: approvedOrDeclinedDateStart
        in: query
        schema:
          type: string
          format: date-time
      - name: approvedOrDeclinedDateEnd
        in: query
        schema:
          type: string
          format: date-time
      - name: deadlineDateStart
        in: query
        schema:
          type: string
          format: date-time
      - name: deadlineDateEnd
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.VendorOnboardingRequest'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.VendorOnboardingRequest'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
      operationId: getApiV1VendorOnboardingRequests
      x-operation-id-source: derived
  /api/v1/Vendor/Onboarding/RequestDetails:
    get:
      tags:
      - VendorOnboarding
      summary: Provides detailed information for a vendor onboarding request
      description: Provides details for a specific vendor onboarding request include requestor, vmo manager, status, vendor, product, criticality, and risk question….
      parameters:
      - name: relationshipKey
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.VendorOnboardingRequestDetail'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.VendorOnboardingRequestDetail'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
      operationId: getApiV1VendorOnboardingRequestDetails
      x-operation-id-source: derived
  /api/v1/Vendor/Onboarding/Information:
    get:
      tags:
      - VendorOnboarding
      summary: Provides vendor onboarding configuration information
      description: Provides vendor onboarding configuration information. This includes the master form, custom forms and request reasons.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.VendorOnboardingInformationResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.VendorOnboardingInformationResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
      operationId: getApiV1VendorOnboardingInformation
      x-operation-id-source: derived
  /api/v1/Vendor/Onboarding/FormDetails:
    get:
      tags:
      - VendorOnboarding
      summary: Provides the details for a specific vendor onboarding request form
      description: Provides the details for a specific vendor onboarding request form include vendor, product, criticality, and risk question.
      parameters:
      - name: formKey
        in: query
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Returns Onboarding Form Questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.OnboardingFormDetails'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.OnboardingFormDetails'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
      operationId: getApiV1VendorOnboardingFormDetails
      x-operation-id-source: derived
  /api/v1/Vendor/Onboarding/Request:
    post:
      tags:
      - VendorOnboarding
      summary: Creates a new or updates an existing onboarding request
      description: Creates a new or updates an existing onboarding request that is in a draft status.
      parameters:
      - name: cultureCode
        in: header
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.OnboardingRequestData'
          application/json:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.OnboardingRequestData'
          text/json:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.OnboardingRequestData'
          application/*+json:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.OnboardingRequestData'
          application/xml:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.OnboardingRequestData'
          text/xml:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.OnboardingRequestData'
          application/*+xml:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.OnboardingRequestData'
      responses:
        '200':
          description: Returns success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenApi.v1.OnboardingResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.OnboardingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
        '403':
          description: If relation api key does not belong to api user's client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
      operationId: postApiV1VendorOnboardingRequest
      x-operation-id-source: derived
  /api/v1/Vendor/Onboarding/FormAnswers:
    get:
      tags:
      - VendorOnboarding
      summary: Get expected answers for onboarding form Questions
      parameters:
      - name: formKey
        in: query
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Returns list of expected answers of onboarding form Questions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ProfileAnswers'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ProfileAnswers'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
            application/xml:
              schema:
                $ref: '#/components/schemas/OpenApi.v1.ErrorResponse'
      operationId: getApiV1VendorOnboardingFormAnswers
      x-operation-id-source: derived
  /api/v1/Vendor/Onboarding/RequestAnswers:
    get:
      tags:
      - VendorOnboarding
      summary: Get expected answers for onboarding form Questions
      parameters:
      - name: relationshipKey
        in: query
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Returns list of expected answers of onboarding form Questions
