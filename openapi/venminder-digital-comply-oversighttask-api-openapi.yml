        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        reviewResults:
          type: array
          items:
            type: string
          nullable: true
        taskOwnerKeys:
          type: array
          items:
            type: string
          nullable: true
        requirementKeys:
          type: array
          items:
            type: string
          nullable: true
