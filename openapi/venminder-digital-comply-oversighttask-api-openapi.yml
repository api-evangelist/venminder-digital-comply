      xml:
        name: Oversight.Request.GetOversightTaskListRequest
    OpenApi.v1.Oversight.Request.CreateOversightTaskRequest:
      title: OpenApi.v1.Oversight.Request.CreateOversightTaskRequest
      type: object
      properties:
        oversightRequirementKey:
          type: string
          nullable: true
        ownerKey:
          type: string
