          type: string
          nullable: true
        name:
          type: string
          nullable: true
        isCritical:
          type: boolean
          nullable: true
        isThirdParty:
          type: boolean
        isFourthParty:
          type: boolean
        confidenceLevel:
          type: string
          nullable: true
