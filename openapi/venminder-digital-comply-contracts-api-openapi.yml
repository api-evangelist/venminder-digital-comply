          text/json:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.Contracts.CreateClientContractRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.Contracts.CreateClientContractRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.Contracts.CreateClientContractRequest'
          text/xml:
            schema:
              $ref: '#/components/schemas/OpenApi.v1.Contracts.CreateClientContractRequest'
          application/*+xml:
            schema:
